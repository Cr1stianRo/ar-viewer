<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cubo AR - Orientación Real</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- COMPONENTE: SEGUIR ORIENTACIÓN DEL CUBO -->
  <script>
    if (typeof AFRAME !== 'undefined') {
      AFRAME.registerComponent('follow-cube-orientation', {
        schema: {
          smoothing: { type: 'number', default: 0.2 }
        },

        init: function() {
          console.log('🎲 Inicializando follow-cube-orientation');

          // Referencias a los 6 targets
          this.targets = {
            0: null, // derecha
            1: null, // arriba
            2: null, // abajo
            3: null, // atrás
            4: null, // frontal
            5: null  // izquierda
          };

          // Mapeo de rotaciones por cara (en grados)
          this.faceRotations = {
            0: { x: 0, y: 90, z: 0 },    // derecha
            1: { x: -90, y: 0, z: 0 },   // arriba
            2: { x: 90, y: 0, z: 0 },    // abajo
            3: { x: 0, y: 180, z: 0 },   // atrás
            4: { x: 0, y: 0, z: 0 },     // frontal (referencia)
            5: { x: 0, y: -90, z: 0 }    // izquierda
          };

          // Estado
          this.currentTarget = null;
          this.currentTargetIndex = null;
          this.isVisible = false;

          // Vectores reutilizables (performance)
          this.targetPos = new THREE.Vector3();
          this.targetQuat = new THREE.Quaternion();
          this.currentQuat = new THREE.Quaternion();
          this.offsetQuat = new THREE.Quaternion();
          this.finalQuat = new THREE.Quaternion();

          // Euler para rotaciones
          this.offsetEuler = new THREE.Euler();

          // Buscar targets
          this.findTargets();
        },

        findTargets: function() {
          const findInterval = setInterval(() => {
            let allFound = true;

            for (let i = 0; i < 6; i++) {
              if (!this.targets[i]) {
                const target = document.getElementById(`target-${i}`);
                if (target) {
                  this.targets[i] = target;
                  this.setupTargetEvents(i);
                  console.log(`✅ Target ${i} encontrado y configurado`);
                } else {
                  allFound = false;
                }
              }
            }

            if (allFound) {
              console.log('✅ Todos los targets configurados');
              clearInterval(findInterval);
            }
          }, 100);
        },

        setupTargetEvents: function(index) {
          const target = this.targets[index];

          target.addEventListener('targetFound', () => {
            console.log(`\n🎯 CARA ${index} DETECTADA`);
            this.currentTarget = target;
            this.currentTargetIndex = index;
            this.isVisible = true;
            this.el.setAttribute('visible', true);

            // Log de orientación
            const rotation = this.faceRotations[index];
            console.log(`   Rotación offset: X=${rotation.x}° Y=${rotation.y}° Z=${rotation.z}°`);
          });

          target.addEventListener('targetLost', () => {
            console.log(`⚠️ CARA ${index} PERDIDA`);

            if (this.currentTargetIndex === index) {
              this.currentTarget = null;
              this.currentTargetIndex = null;
              this.isVisible = false;
              this.el.setAttribute('visible', false);
            }
          });
        },

        tick: function(time, timeDelta) {
          if (!this.isVisible || !this.currentTarget) return;

          const targetObj = this.currentTarget.object3D;
          const modelObj = this.el.object3D;
          const smoothing = this.data.smoothing;
          const index = this.currentTargetIndex;

          // 1. OBTENER POSICIÓN DEL TARGET
          targetObj.getWorldPosition(this.targetPos);

          // 2. OBTENER ROTACIÓN DEL TARGET
          targetObj.getWorldQuaternion(this.targetQuat);

          // 3. CREAR OFFSET DE ROTACIÓN SEGÚN LA CARA
          const faceRot = this.faceRotations[index];
          this.offsetEuler.set(
            THREE.MathUtils.degToRad(faceRot.x),
            THREE.MathUtils.degToRad(faceRot.y),
            THREE.MathUtils.degToRad(faceRot.z),
            'XYZ'
          );
          this.offsetQuat.setFromEuler(this.offsetEuler);

          // 4. COMBINAR ROTACIÓN DEL TARGET + OFFSET
          this.finalQuat.copy(this.targetQuat);
          this.finalQuat.multiply(this.offsetQuat);

          // 5. APLICAR TRANSFORMACIÓN CON SMOOTHING
          // Position (lerp)
          modelObj.position.lerp(this.targetPos, smoothing);

          // Rotation (slerp para suavidad)
          this.currentQuat.copy(modelObj.quaternion);
          this.currentQuat.slerp(this.finalQuat, smoothing);
          modelObj.quaternion.copy(this.currentQuat);
        }
      });

      console.log('✅ Componente follow-cube-orientation registrado');
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
    }

    #ar-scene {
      width: 100% !important;
      height: 100% !important;
      position: fixed;
      top: 0;
      left: 0;
    }

    #ar-scene canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #permission-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 20px;
      padding: 40px;
      text-align: center;
      font-family: monospace;
      color: #fff;
    }

    #permission-screen .big-icon {
      font-size: 72px;
    }

    #permission-screen h1 {
      font-size: 20px;
      color: #00ff88;
      letter-spacing: 3px;
      font-weight: 700;
    }

    #permission-screen p {
      font-size: 13px;
      color: #888;
      line-height: 1.6;
    }

    #start-btn {
      background: transparent;
      border: 2px solid #00ff88;
      color: #00ff88;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 3px;
      padding: 16px 40px;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 8px;
      transition: all 0.3s;
      margin-top: 20px;
      font-weight: 700;
    }

    #start-btn:hover {
      background: #00ff88;
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Permission Screen -->
  <div id="permission-screen">
    <div class="big-icon">🎲</div>
    <h1>CUBO AR - ORIENTACIÓN REAL</h1>
    <p>El modelo 3D sigue la orientación del cubo en tiempo real<br>
    Rotación suave y continua según la cara detectada</p>
    <button id="start-btn" onclick="startAR()">INICIAR</button>
  </div>

  <!-- AR Scene -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: marker/cubo.mind;
                  autoStart: false;
                  uiLoading: no;
                  uiError: no;
                  uiScanning: no;
                  filterMinCF: 0.0001;
                  filterBeta: 1000;
                  warmupTolerance: 2;
                  missTolerance: 5;
                  maxTrack: 1;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true; precision: high;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display:none;"
  >

    <!-- TARGETS (invisibles, solo para tracking) -->
    <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="target-2" mindar-image-target="targetIndex: 2"></a-entity>
    <a-entity id="target-3" mindar-image-target="targetIndex: 3"></a-entity>
    <a-entity id="target-4" mindar-image-target="targetIndex: 4"></a-entity>
    <a-entity id="target-5" mindar-image-target="targetIndex: 5"></a-entity>

    <!-- MODELO 3D (sigue la orientación del cubo) -->
    <a-entity id="cube-model" follow-cube-orientation="smoothing: 0.2" visible="false">
      <a-gltf-model
        src="modelos/Chicken.glb"
        position="0 0 0"
        rotation="0 0 0"
        scale="1.0 1.0 1.0"
      ></a-gltf-model>
    </a-entity>

    <!-- Iluminación -->
    <a-light type="ambient" intensity="1.0"></a-light>
    <a-light type="directional" intensity="1.5" position="1 1 1"></a-light>
    <a-light type="point" intensity="0.8" position="-1 0.5 0"></a-light>

    <a-camera
      id="ar-camera"
      look-controls="enabled: false"
      wasd-controls="enabled: false"
    ></a-camera>
  </a-scene>

  <!-- LÓGICA PRINCIPAL -->
  <script>
    console.log('🎲 CUBO AR - Sistema de orientación real\n');

    // ========== FORZAR CÁMARA PRINCIPAL (NO WIDE) ==========
    (function setupCamera() {
      const original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

      navigator.mediaDevices.getUserMedia = async function(constraints) {
        console.log('📹 Configurando cámara...');

        if (constraints && constraints.video) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const cameras = devices.filter(d => d.kind === 'videoinput');

          console.log('📹 Cámaras disponibles:', cameras.map(c => c.label));

          // BUSCAR CÁMARA PRINCIPAL (NO WIDE, NO ULTRA, NO 0.5x)
          const mainCamera = cameras.find(d => {
            const label = (d.label || '').toLowerCase();
            const isBack = label.includes('back') || label.includes('rear') || label.includes('trasera');
            const notWide = !label.includes('wide') &&
                           !label.includes('ultra') &&
                           !label.includes('0.5') &&
                           !label.includes('grand') &&
                           !label.includes('ultrawide');
            return isBack && notWide;
          });

          if (mainCamera) {
            console.log('✅ CÁMARA PRINCIPAL:', mainCamera.label);

            constraints.video = {
              deviceId: { exact: mainCamera.deviceId },
              width: { ideal: 1920, max: 1920 },
              height: { ideal: 1080, max: 1080 },
              frameRate: { ideal: 60, max: 60 }
            };

            // Autofocus continuo
            constraints.video.advanced = [
              { focusMode: 'continuous' },
              { exposureMode: 'continuous' },
              { whiteBalanceMode: 'continuous' }
            ];
          } else {
            console.warn('⚠️ Cámara principal no encontrada');
            constraints.video = {
              facingMode: { exact: 'environment' },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
              frameRate: { ideal: 60 }
            };
          }
        }

        return original(constraints);
      };

      console.log('✅ Interceptor de cámara instalado\n');
    })();

    // ========== INICIAR AR ==========
    async function startAR() {
      try {
        console.log('🚀 Iniciando AR...\n');

        document.getElementById('permission-screen').style.display = 'none';
        document.getElementById('ar-scene').style.display = 'block';

        const scene = document.querySelector('a-scene');

        if (scene.hasLoaded) {
          initMindAR();
        } else {
          scene.addEventListener('loaded', initMindAR);
        }

      } catch (error) {
        console.error('❌ Error:', error);
        alert('Error: ' + error.message);
      }
    }

    // ========== INICIALIZAR MINDAR ==========
    function initMindAR() {
      console.log('🧠 Inicializando MindAR...');

      const scene = document.querySelector('a-scene');
      const arSystem = scene.systems['mindar-image-system'];

      // Iniciar MindAR
      arSystem.start();
      console.log('✅ MindAR iniciado');

      // Forzar resize
      setTimeout(() => {
        if (scene.renderer) {
          const w = window.innerWidth;
          const h = window.innerHeight;
          scene.renderer.setSize(w, h, false);
          console.log(`📐 Renderer: ${w}x${h}`);
        }
      }, 100);

      console.log('✅ Sistema listo\n');
      console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
      console.log('MAPEO DE CARAS:');
      console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
      console.log('Target 0 → DERECHA   (Y: 90°)');
      console.log('Target 1 → ARRIBA    (X: -90°)');
      console.log('Target 2 → ABAJO     (X: 90°)');
      console.log('Target 3 → ATRÁS     (Y: 180°)');
      console.log('Target 4 → FRONTAL   (referencia)');
      console.log('Target 5 → IZQUIERDA (Y: -90°)');
      console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n');
    }

    console.log('✅ Sistema cargado. Presiona INICIAR.\n');
  </script>

</body>
</html>
