<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cubo AR</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
    }

    #ar-scene {
      width: 100% !important;
      height: 100% !important;
      position: fixed;
      top: 0;
      left: 0;
    }

    #ar-scene canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #permission-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 20px;
      padding: 40px;
      text-align: center;
      font-family: monospace;
    }

    #permission-screen .big-icon {
      font-size: 72px;
    }

    #permission-screen h1 {
      font-size: 20px;
      color: #fff;
      letter-spacing: 3px;
      font-weight: 700;
    }

    #start-btn {
      background: transparent;
      border: 2px solid #00ff88;
      color: #00ff88;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 3px;
      padding: 16px 40px;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 8px;
      transition: all 0.3s;
      margin-top: 20px;
      font-weight: 700;
    }

    #start-btn:hover {
      background: #00ff88;
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Permission Screen -->
  <div id="permission-screen">
    <div class="big-icon">🎲</div>
    <h1>CUBO AR</h1>
    <button id="start-btn" onclick="startAR()">INICIAR</button>
  </div>

  <!-- AR Scene -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: marker/cubo.mind;
                  autoStart: false;
                  uiLoading: no;
                  uiError: no;
                  uiScanning: no;
                  filterMinCF: 0.001;
                  filterBeta: 10;
                  warmupTolerance: 2;
                  missTolerance: 0;
                  maxTrack: 1;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true; precision: high;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display:none;"
  >

    <!-- CARA 0 - MODELO CHICKEN.GLB -->
    <a-entity id="target-0" mindar-image-target="targetIndex: 0">
      <a-gltf-model
        id="face-0"
        src="modelos/Chicken.glb"
        position="0 0 0"
        rotation="-90 0 0"
        scale="0.01 0.01 0.01"
        visible="false"
      ></a-gltf-model>
    </a-entity>

    <!-- CARA 1 - AZUL -->
    <a-entity id="target-1" mindar-image-target="targetIndex: 1">
      <a-plane
        id="face-1"
        width="1"
        height="1"
        position="0 0 0.01"
        rotation="0 0 0"
        material="color: #3333ff; opacity: 0.9; side: double; transparent: true; shader: flat;"
        visible="false"
      ></a-plane>
    </a-entity>

    <!-- CARA 2 - VERDE -->
    <a-entity id="target-2" mindar-image-target="targetIndex: 2">
      <a-plane
        id="face-2"
        width="1"
        height="1"
        position="0 0 0.01"
        rotation="0 0 0"
        material="color: #33ff33; opacity: 0.9; side: double; transparent: true; shader: flat;"
        visible="false"
      ></a-plane>
    </a-entity>

    <!-- CARA 3 - AMARILLA -->
    <a-entity id="target-3" mindar-image-target="targetIndex: 3">
      <a-plane
        id="face-3"
        width="1"
        height="1"
        position="0 0 0.01"
        rotation="0 0 0"
        material="color: #ffff33; opacity: 0.9; side: double; transparent: true; shader: flat;"
        visible="false"
      ></a-plane>
    </a-entity>

    <!-- CARA 4 - MAGENTA -->
    <a-entity id="target-4" mindar-image-target="targetIndex: 4">
      <a-plane
        id="face-4"
        width="1"
        height="1"
        position="0 0 0.01"
        rotation="0 0 0"
        material="color: #ff33ff; opacity: 0.9; side: double; transparent: true; shader: flat;"
        visible="false"
      ></a-plane>
    </a-entity>

    <!-- CARA 5 - CYAN -->
    <a-entity id="target-5" mindar-image-target="targetIndex: 5">
      <a-plane
        id="face-5"
        width="1"
        height="1"
        position="0 0 0.01"
        rotation="0 0 0"
        material="color: #33ffff; opacity: 0.9; side: double; transparent: true; shader: flat;"
        visible="false"
      ></a-plane>
    </a-entity>

    <!-- Iluminación -->
    <a-light type="ambient" intensity="1.0"></a-light>
    <a-light type="directional" intensity="1.2" position="1 1 1"></a-light>
    <a-light type="point" intensity="0.8" position="-1 0.5 0"></a-light>

    <a-camera
      id="ar-camera"
      look-controls="enabled: false"
      wasd-controls="enabled: false"
    ></a-camera>
  </a-scene>

  <!-- LÓGICA -->
  <script>
    console.log('🎲 CUBO AR - Inicializando...');

    const state = {
      detectedFaces: new Set(),
      currentFace: null,
      allFaces: [0, 1, 2, 3, 4, 5],
      faceElements: {},
      targetElements: {}
    };

    // ========== FORZAR CÁMARA PRINCIPAL (NO WIDE) ==========
    (function setupCamera() {
      const original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

      navigator.mediaDevices.getUserMedia = async function(constraints) {
        console.log('📹 Solicitando cámara...');

        if (constraints && constraints.video) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const cameras = devices.filter(d => d.kind === 'videoinput');

          console.log('📹 Cámaras disponibles:', cameras.map(c => c.label));

          // BUSCAR CÁMARA PRINCIPAL (NO WIDE, NO ULTRA, NO 0.5x)
          const mainCamera = cameras.find(d => {
            const label = (d.label || '').toLowerCase();
            const isBack = label.includes('back') || label.includes('rear') || label.includes('trasera');
            const notWide = !label.includes('wide') && !label.includes('ultra') && !label.includes('0.5') && !label.includes('grand');
            return isBack && notWide;
          });

          if (mainCamera) {
            console.log('✅ CÁMARA PRINCIPAL ENCONTRADA:', mainCamera.label);

            constraints.video = {
              deviceId: { exact: mainCamera.deviceId },
              width: { ideal: 1920, max: 1920 },
              height: { ideal: 1080, max: 1080 },
              frameRate: { ideal: 60, max: 60 },
              aspectRatio: { ideal: 16/9 }
            };

            // Autofocus continuo
            constraints.video.advanced = [
              { focusMode: 'continuous' },
              { exposureMode: 'continuous' },
              { whiteBalanceMode: 'continuous' }
            ];
          } else {
            console.warn('⚠️ Cámara principal no encontrada, usando environment');
            constraints.video = {
              facingMode: { exact: 'environment' },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
              frameRate: { ideal: 60 }
            };
          }
        }

        return original(constraints);
      };

      console.log('✅ Interceptor de cámara instalado');
    })();

    // ========== OCULTAR TODAS LAS CARAS ==========
    function hideAllFaces() {
      state.allFaces.forEach(i => {
        const face = state.faceElements[i];
        if (face) {
          face.setAttribute('visible', false);
        }
      });
    }

    // ========== MOSTRAR SOLO UNA CARA ==========
    function showOnlyFace(faceIndex) {
      console.log(`🎯 Mostrando cara ${faceIndex}`);

      // Ocultar todas
      hideAllFaces();

      // Mostrar solo la detectada
      const face = state.faceElements[faceIndex];
      if (face) {
        face.setAttribute('visible', true);
        console.log(`✅ Cara ${faceIndex} visible`);
      }

      state.currentFace = faceIndex;
      state.detectedFaces.add(faceIndex);
    }

    // ========== INICIAR AR ==========
    async function startAR() {
      try {
        console.log('🚀 Iniciando AR...');

        document.getElementById('permission-screen').style.display = 'none';
        document.getElementById('ar-scene').style.display = 'block';

        const scene = document.querySelector('a-scene');

        if (scene.hasLoaded) {
          initMindAR();
        } else {
          scene.addEventListener('loaded', initMindAR);
        }

      } catch (error) {
        console.error('❌ Error:', error);
        alert('Error: ' + error.message);
      }
    }

    // ========== INICIALIZAR MINDAR ==========
    function initMindAR() {
      console.log('🧠 Inicializando MindAR...');

      const scene = document.querySelector('a-scene');
      const arSystem = scene.systems['mindar-image-system'];

      // Cachear elementos
      state.allFaces.forEach(i => {
        state.faceElements[i] = document.getElementById(`face-${i}`);
        state.targetElements[i] = document.getElementById(`target-${i}`);
        console.log(`📦 Cara ${i}:`, state.faceElements[i] ? 'OK' : 'ERROR');
      });

      // Iniciar MindAR
      arSystem.start();
      console.log('✅ MindAR iniciado');

      // Forzar resize
      setTimeout(() => {
        if (scene.renderer) {
          scene.renderer.setSize(window.innerWidth, window.innerHeight, false);
          console.log('📐 Renderer resized');
        }
      }, 100);

      // Configurar tracking
      setupTracking();

      console.log('✅ Sistema listo\n');
    }

    // ========== CONFIGURAR TRACKING ==========
    function setupTracking() {
      console.log('🎯 Configurando tracking...\n');

      state.allFaces.forEach(i => {
        const target = state.targetElements[i];

        if (!target) {
          console.error(`❌ Target ${i} no encontrado`);
          return;
        }

        // TARGET ENCONTRADO
        target.addEventListener('targetFound', () => {
          console.log(`✅ TARGET ${i} DETECTADO`);
          showOnlyFace(i);
        });

        // TARGET PERDIDO
        target.addEventListener('targetLost', () => {
          console.log(`⚠️ TARGET ${i} PERDIDO`);

          const face = state.faceElements[i];
          if (face) {
            face.setAttribute('visible', false);
          }

          if (state.currentFace === i) {
            state.currentFace = null;
          }
        });

        console.log(`✅ Target ${i} configurado`);
      });

      console.log('\n✅ Tracking configurado\n');
    }

    console.log('✅ Sistema cargado\n');
  </script>

</body>
</html>
