<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Viewer — Marcador Físico</title>

  <script>
    // Forzar cámara trasera principal (no wide, no telefoto) - Optimizado para Samsung S21 FE
    window._arVideoConstraints = null;

    async function detectMainCamera() {
      try {
        // Primero pedimos acceso genérico
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        tempStream.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const cameras = devices.filter(d => d.kind === 'videoinput');

        console.log('📷 Cámaras disponibles:');
        cameras.forEach((cam, i) => console.log(`  ${i}: ${cam.label}`));

        // Filtramos cámaras wide/ultra/tele (Samsung S21 FE tiene wide como cámara 0)
        const excludeKeywords = ['wide', 'ultra', 'ultra-wide', 'telephoto', 'tele', 'depth', 'macro', 'front', '0.6'];

        // Buscamos la cámara principal (normalmente es la segunda trasera en Samsung)
        let mainCam = cameras.find((cam, idx) => {
          const label = cam.label.toLowerCase();
          const isBack = label.includes('back') || label.includes('rear') || label.includes('camera2 0');
          const notExcluded = !excludeKeywords.some(kw => label.includes(kw));
          return isBack && notExcluded;
        });

        // Fallback: si no encontramos, tomamos la primera trasera que no sea wide
        if (!mainCam) {
          mainCam = cameras.find(cam => {
            const label = cam.label.toLowerCase();
            return !excludeKeywords.some(kw => label.includes(kw)) && !label.includes('front');
          });
        }

        if (mainCam) {
          console.log('✅ Cámara principal seleccionada:', mainCam.label);
          // Configuramos constraints específicos para AR.js
          window._arVideoConstraints = {
            deviceId: { exact: mainCam.deviceId },
            facingMode: 'environment',
            width: { ideal: 640 },
            height: { ideal: 480 }
          };
        } else {
          console.warn('⚠️ No se detectó cámara principal, usando default');
        }
      } catch(e) {
        console.warn('❌ Error detectando cámara:', e);
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Componente personalizado de smoothing extra agresivo -->
  <script>
    AFRAME.registerComponent('smooth-transform', {
      schema: {
        enabled: { type: 'boolean', default: true },
        factor: { type: 'number', default: 0.15 } // Más bajo = más suave (0.05-0.3)
      },
      init: function() {
        this.targetPosition = new THREE.Vector3();
        this.targetRotation = new THREE.Euler();
        this.targetQuaternion = new THREE.Quaternion();
        this.currentQuaternion = new THREE.Quaternion();
      },
      tick: function(time, delta) {
        if (!this.data.enabled) return;

        const object3D = this.el.object3D;
        const factor = this.data.factor;

        // Suavizado de posición (lerp)
        this.targetPosition.copy(object3D.position);
        object3D.position.lerp(this.targetPosition, factor);

        // Suavizado de rotación (slerp)
        this.currentQuaternion.copy(object3D.quaternion);
        this.targetQuaternion.setFromEuler(object3D.rotation);
        object3D.quaternion.slerpQuaternions(
          this.currentQuaternion,
          this.targetQuaternion,
          factor
        );
      }
    });
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Space Mono', monospace;
      background: #0a0a0a;
      overflow: hidden;
    }

    /* Overlay UI */
    #ui-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* Top bar */
    #topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    }

    #logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #00ff88;
      text-transform: uppercase;
    }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 8px #ff4444;
      animation: pulse 1.5s ease-in-out infinite;
      display: inline-block;
      margin-right: 8px;
    }
    #status-dot.found {
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
      animation: none;
    }

    #status-text {
      font-size: 11px;
      color: #aaa;
      letter-spacing: 1px;
    }

    /* Instruction card */
    #instruction-card {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 12px;
      padding: 18px 28px;
      text-align: center;
      backdrop-filter: blur(10px);
      transition: opacity 0.5s ease;
      min-width: 260px;
    }

    #instruction-card.hidden {
      opacity: 0;
    }

    #instruction-card .icon {
      font-size: 28px;
      margin-bottom: 8px;
      display: block;
    }

    #instruction-card p {
      font-size: 12px;
      color: #ccc;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }

    #instruction-card strong {
      color: #00ff88;
    }

    /* Corner scan lines aesthetic */
    .corner {
      position: absolute;
      width: 30px; height: 30px;
    }
    .corner-tl { top: 70px; left: 20px; border-top: 2px solid #00ff88; border-left: 2px solid #00ff88; }
    .corner-tr { top: 70px; right: 20px; border-top: 2px solid #00ff88; border-right: 2px solid #00ff88; }
    .corner-bl { bottom: 130px; left: 20px; border-bottom: 2px solid #00ff88; border-left: 2px solid #00ff88; }
    .corner-br { bottom: 130px; right: 20px; border-bottom: 2px solid #00ff88; border-right: 2px solid #00ff88; }

    /* Scan line animation */
    #scan-line {
      position: absolute;
      top: 70px;
      left: 20px;
      right: 20px;
      height: 1px;
      background: linear-gradient(to right, transparent, #00ff88, transparent);
      opacity: 0.6;
      animation: scan 3s linear infinite;
    }

    @keyframes scan {
      0%   { top: 70px; opacity: 0.6; }
      48%  { opacity: 0.6; }
      50%  { top: calc(100% - 130px); opacity: 0; }
      51%  { top: 70px; opacity: 0; }
      52%  { opacity: 0.6; }
      100% { top: calc(100% - 130px); opacity: 0.6; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Camera permission overlay */
    #permission-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 20px;
      padding: 40px;
      text-align: center;
    }

    #permission-screen .big-icon { font-size: 64px; }

    #permission-screen h1 {
      font-size: 18px;
      color: #fff;
      letter-spacing: 2px;
      font-weight: 700;
    }

    #permission-screen p {
      font-size: 13px;
      color: #888;
      line-height: 1.7;
      max-width: 280px;
    }

    #start-btn {
      pointer-events: all;
      background: transparent;
      border: 1px solid #00ff88;
      color: #00ff88;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      padding: 14px 32px;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 6px;
      transition: all 0.2s;
      margin-top: 10px;
    }

    #start-btn:hover {
      background: #00ff88;
      color: #0a0a0a;
    }

    #hint {
      font-size: 11px;
      color: #444;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Permission / Start Screen -->
  <div id="permission-screen">
    <div class="big-icon">📷</div>
    <h1>AR VIEWER</h1>
    <p>Apunta tu cámara al <strong style="color:#00ff88">marcador #3</strong> para ver el modelo 3D en realidad aumentada.</p>
    <button id="start-btn" onclick="startAR()">INICIAR CÁMARA</button>
    <p id="hint">Necesita acceso a la cámara para funcionar</p>
  </div>

  <!-- AR Scene (hidden until started) -->
  <div id="ar-container" style="display:none; width:100%; height:100vh;">
    <a-scene
      embedded
      arjs="sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix;
            matrixCodeType: 3x3_HAMMING63;
            trackingMethod: best;
            maxDetectionRate: 60;
            canvasWidth: 640;
            canvasHeight: 480;
            minConfidence: 0.6;
            cameraParametersUrl: https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/data/camera_para.dat;
            facingMode: environment;"
      renderer="logarithmicDepthBuffer: true;
                antialias: true;
                colorManagement: true;
                sortObjects: true;
                physicallyCorrectLights: true;
                maxCanvasWidth: 640;
                maxCanvasHeight: 480;"
      vr-mode-ui="enabled: false"
      style="width:100%;height:100%;"
    >
      <!-- Assets -->
      <a-assets>
        <a-asset-item id="gallina-model" src="modelos/chicken/source/Gallina.glb"></a-asset-item>
      </a-assets>

      <!-- Marcador de matriz #3 (HAMMING 3x3) - Tracking optimizado -->
      <a-marker
        type="barcode"
        value="3"
        id="marker-3"
        emitevents="true"
        smooth="true"
        smoothCount="20"
        smoothTolerance="0.005"
        smoothThreshold="4"
      >

        <!-- Cubo de prueba (para verificar que el marcador funciona) -->
        <a-box
          position="0 0.5 0"
          color="#ff0000"
          opacity="0.5"
          scale="0.3 0.3 0.3"
        ></a-box>

        <!-- Modelo 3D de Gallina -->
        <a-entity
          id="gallina-entity"
          gltf-model="#gallina-model"
          position="0 0.5 0"
          scale="1 1 1"
          rotation="0 0 0"
        ></a-entity>

        <!-- Luz ambiental para iluminar el modelo -->
        <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.8" position="2 4 2"></a-light>

      </a-marker>

      <!-- Cámara AR -->
      <a-entity camera></a-entity>
    </a-scene>
  </div>

  <!-- UI Overlay (visible durante AR) -->
  <div id="ui-overlay" style="display:none;">
    <div id="topbar">
      <span id="logo">◈ AR Viewer</span>
      <div style="display:flex; align-items:center;">
        <span id="status-dot"></span>
        <span id="status-text">BUSCANDO MARCADOR</span>
      </div>
    </div>

    <!-- Corners -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div id="scan-line"></div>

    <!-- Instruction card -->
    <div id="instruction-card">
      <span class="icon">🎯</span>
      <p>Apunta la cámara al <strong>marcador #3</strong><br>mantenlo bien iluminado y a 15-30cm de distancia</p>
    </div>
  </div>

  <script>
    async function startAR() {
      // Detectar cámara principal antes de iniciar AR.js
      await detectMainCamera();

      document.getElementById('permission-screen').style.display = 'none';
      document.getElementById('ar-container').style.display = 'block';
      document.getElementById('ui-overlay').style.display = 'block';

      // Inyectar constraints de video si detectamos una cámara específica
      if (window._arVideoConstraints) {
        // Interceptamos getUserMedia para forzar nuestros constraints
        const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = function(constraints) {
          if (constraints && constraints.video) {
            console.log('🔧 Aplicando constraints personalizados:', window._arVideoConstraints);
            constraints.video = window._arVideoConstraints;
          }
          return originalGetUserMedia(constraints);
        };
      }

      // Persistent tracking - mantiene contenido visible por 2seg al perder marcador
      let markerLostTimeout = null;
      let isMarkerVisible = false;

      setTimeout(() => {
        const marker = document.getElementById('marker-3');
        if (!marker) {
          console.error('❌ Marcador #3 no encontrado en el DOM');
          return;
        }

        console.log('✅ Marcador #3 registrado con persistent tracking activado');

        // Debug: verificar carga del modelo 3D
        const gallinaEntity = document.getElementById('gallina-entity');
        if (gallinaEntity) {
          gallinaEntity.addEventListener('model-loaded', () => {
            console.log('✅ Modelo de gallina cargado correctamente');
          });
          gallinaEntity.addEventListener('model-error', (e) => {
            console.error('❌ Error cargando modelo:', e);
          });
        }

        marker.addEventListener('markerFound', () => {
          // Limpiar timeout si estaba esperando ocultar
          if (markerLostTimeout) {
            clearTimeout(markerLostTimeout);
            markerLostTimeout = null;
          }

          isMarkerVisible = true;
          console.log('🎯 MARCADOR #3 DETECTADO - TRACKING ACTIVO');
          document.getElementById('status-dot').classList.add('found');
          document.getElementById('status-text').textContent = 'TRACKING ACTIVO';
          document.getElementById('instruction-card').classList.add('hidden');
        });

        marker.addEventListener('markerLost', () => {
          console.log('⏳ Marcador perdido temporalmente - esperando 2 seg...');

          // No ocultar inmediatamente, esperar 2 segundos por si vuelve a detectar
          markerLostTimeout = setTimeout(() => {
            if (!isMarkerVisible) {
              console.log('❌ Marcador perdido definitivamente');
              document.getElementById('status-dot').classList.remove('found');
              document.getElementById('status-text').textContent = 'BUSCANDO MARCADOR #3';
              document.getElementById('instruction-card').classList.remove('hidden');
            }
          }, 2000); // Mantener visible 2 segundos

          isMarkerVisible = false;
        });
      }, 2000);
    }
  </script>

</body>
</html>
